# Local development only. Every port is bound to 127.0.0.1 and the secrets below are
# placeholders: do not expose this stack, and do not reuse these values anywhere reachable.
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - positions_mongo:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PORT: "3010"
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/copypools_positions
      REDIS_URL: redis://redis:6379
      ADMIN_SECRET: change-me
      ETHEREUM_UNISWAP_V3_SUBGRAPH_URL: ${ETHEREUM_UNISWAP_V3_SUBGRAPH_URL:-}
      ETHEREUM_UNISWAP_V4_SUBGRAPH_URL: ${ETHEREUM_UNISWAP_V4_SUBGRAPH_URL:-}
    depends_on:
      - mongo
      - redis

volumes:
  positions_mongo:
